<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="robots" content="index,follow" />
    <title>Phishing Detector — public endpoint demo</title>
    <meta
      name="description"
      content="Enter a URL and read the verdict returned by the public Phishing Detector endpoint."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f4f1ea;
        --ink: #141511;
        --accent: #c9502a;
        --deep: #14231f;
        --line: #d6d1c4;
        --muted: #6d6b62;
        --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .shell {
        width: min(760px, calc(100% - 40px));
        margin: 0 auto;
        padding: 72px 0 96px;
      }

      .eyebrow {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 12px 0 8px;
        font-size: clamp(34px, 6vw, 56px);
        font-weight: 640;
        letter-spacing: -0.035em;
        line-height: 1.02;
      }

      .lede {
        margin: 0;
        max-width: 52ch;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .panel {
        margin-top: 36px;
        padding: 24px;
        border: 1px solid var(--line);
        background: #f8f6f0;
      }

      form {
        display: flex;
        gap: 10px;
      }

      input[type="url"] {
        flex: 1 1 auto;
        min-width: 0;
        padding: 13px 14px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px var(--font-mono);
      }

      input[type="url"]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      button {
        padding: 13px 20px;
        border: 1px solid var(--deep);
        border-radius: 0;
        background: var(--deep);
        color: var(--bg);
        font: 600 12px var(--font-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }

      button:hover { background: var(--accent); border-color: var(--accent); }
      button:disabled { cursor: wait; opacity: 0.62; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .result {
        display: none;
        margin-top: 22px;
        padding: 18px;
        border: 1px solid var(--line);
        border-left: 4px solid var(--muted);
        background: var(--bg);
      }

      .result[data-state="safe"] { border-left-color: var(--deep); }
      .result[data-state="phishing"] { border-left-color: var(--accent); }
      .result[data-state="error"] { border-left-color: var(--muted); }

      .result[data-state] { display: block; }

      .result-label {
        font: 10px var(--font-mono);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .result-value {
        margin-top: 8px;
        font-size: 20px;
        font-weight: 620;
        letter-spacing: -0.02em;
      }

      details {
        margin-top: 14px;
        font: 11px/1.6 var(--font-mono);
        color: var(--muted);
      }

      summary { cursor: pointer; }

      pre {
        margin: 10px 0 0;
        padding: 12px;
        overflow-x: auto;
        background: #ece8dd;
        color: var(--ink);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .foot {
        margin-top: 28px;
        font: 11px var(--font-mono);
        color: var(--muted);
      }

      .foot a { color: var(--deep); text-underline-offset: 3px; }

      @media (max-width: 560px) {
        .shell { width: min(100% - 28px, 760px); padding-top: 48px; }
        form, #field-row { flex-direction: column; }
        button { width: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Public endpoint demo</p>
      <h1>Phishing Detector</h1>
      <p class="lede">
        Enter a URL below. The page calls the same public endpoint used by the browser tool and shows the verdict it returns.
      </p>

      <section class="panel" aria-label="URL check">
        <form id="check-form">
          <label for="target" class="eyebrow" style="display:block; margin-bottom:10px;">URL to check</label>
          <div style="display:flex; gap:10px; flex:1 1 auto; min-width:0;" id="field-row">
            <input id="target" name="target" type="url" inputmode="url" required placeholder="https://example.com" autocomplete="off" />
            <button id="submit" type="submit">Check URL</button>
          </div>
        </form>

        <div id="result" class="result" role="status" aria-live="polite">
          <div class="result-label">Endpoint verdict</div>
          <div class="result-value" id="result-value"></div>
          <details>
            <summary>Raw response</summary>
            <pre id="raw"></pre>
          </details>
        </div>
      </section>

      <p class="foot"><a href="/">← Back to portfolio</a></p>
    </main>

    <script>
      const form = document.getElementById('check-form')
      const input = document.getElementById('target')
      const button = document.getElementById('submit')
      const result = document.getElementById('result')
      const value = document.getElementById('result-value')
      const raw = document.getElementById('raw')

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        const target = input.value.trim()
        if (!target) {
          input.focus()
          return
        }

        button.disabled = true
        button.textContent = 'Checking…'
        value.textContent = 'Waiting for endpoint…'
        result.dataset.state = 'error'
        raw.textContent = ''

        try {
          const response = await fetch(
            'https://phishing-detector-nhel.onrender.com/api/' + encodeURI(target)
          )
          const text = await response.text()
          raw.textContent = text

          if (!response.ok) {
            result.dataset.state = 'error'
            value.textContent = 'Endpoint returned HTTP ' + response.status
            return
          }

          let data
          try {
            data = JSON.parse(text)
          } catch {
            result.dataset.state = 'error'
            value.textContent = 'Endpoint did not return JSON'
            return
          }

          const verdict = String(data.result || data.verdict || '').trim()
          if (!verdict) {
            result.dataset.state = 'error'
            value.textContent = 'No verdict field in response'
            return
          }

          const lower = verdict.toLowerCase()
          result.dataset.state = lower.includes('phish') ? 'phishing' : 'safe'
          value.textContent = verdict
        } catch (error) {
          result.dataset.state = 'error'
          value.textContent = 'Could not reach endpoint'
          raw.textContent = String(error)
        } finally {
          button.disabled = false
          button.textContent = 'Check URL'
        }
      })
    </script>
  </body>
</html>
